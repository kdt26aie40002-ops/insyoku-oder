<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テーブルオーダーシステム</title>
<link rel="stylesheet" href="/style.css">
<style>
  main { max-width: 900px; margin: 0 auto; padding: 40px 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 24px; }
  .card {
    display: block; padding: 24px; border-radius: var(--radius); background: var(--surface);
    box-shadow: var(--shadow); color: inherit; text-decoration: none; border: 2px solid transparent;
  }
  .card:hover { border-color: var(--primary); }
  .card .icon { font-size: 2.5rem; }
  .card h2 { margin-top: .4em; }
</style>
</head>
<body>
<main>
  <h1>🍽️ テーブルオーダーシステム</h1>
  <p class="muted">使う端末の画面を選んでください。複数のブラウザやタブで同時に開くと、注文がリアルタイムに連動します。</p>
  <div class="cards">
    <a class="card" href="/table">
      <div class="icon">📱</div>
      <h2>テーブル端末</h2>
      <p class="muted">各テーブルに置くタブレット用。お客様がメニューを見て注文します。</p>
    </a>
    <a class="card" href="/kitchen">
      <div class="icon">👨‍🍳</div>
      <h2>キッチン</h2>
      <p class="muted">入った注文を一覧表示。調理開始・提供済を記録します。</p>
    </a>
    <a class="card" href="/staff">
      <div class="icon">🧾</div>
      <h2>ホール / レジ</h2>
      <p class="muted">テーブル状況・呼び出し対応・会計・品切れ設定を行います。</p>
    </a>
  </div>
</main>
</body>
</html>

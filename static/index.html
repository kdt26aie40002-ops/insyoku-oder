<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尾関屋 | テーブルオーダーシステム</title>
<link rel="stylesheet" href="/style.css">
<style>
  main { max-width: 960px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  main > .ornament { width: min(420px, 80%); margin: 0 auto 16px; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 500; letter-spacing: .3em; margin-bottom: .1em; }
  .subtitle { color: var(--gold); letter-spacing: .3em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; text-align: left; }
  .card {
    display: block; padding: 30px 26px; color: inherit; text-decoration: none;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); transition: border-color .2s, box-shadow .2s;
  }
  .card:hover { border-color: var(--gold); box-shadow: var(--shadow); }
  .card .label { color: var(--gold); letter-spacing: .3em; font-size: .75rem; }
  .card h2 { margin: .5em 0; letter-spacing: .15em; }
</style>
</head>
<body>
<main>
  <div class="ornament">Table Order</div>
  <h1>尾関屋</h1>
  <p class="subtitle">テーブルオーダーシステム</p>
  <p class="muted">使う端末の画面を選んでください。複数のブラウザやタブで同時に開くと、注文がリアルタイムに連動します。</p>
  <div class="cards">
    <a class="card" href="/table">
      <div class="label">Guest</div>
      <h2>テーブル端末</h2>
      <p class="muted">各テーブルに置くタブレット用。お客様がメニューを見て注文します。</p>
    </a>
    <a class="card" href="/kitchen">
      <div class="label">Kitchen</div>
      <h2>キッチン</h2>
      <p class="muted">入った注文を一覧表示。調理開始・提供済を記録します。</p>
    </a>
    <a class="card" href="/staff">
      <div class="label">Floor</div>
      <h2>ホール / レジ</h2>
      <p class="muted">テーブル状況・呼び出し対応・会計・品切れ設定を行います。</p>
    </a>
  </div>
</main>
</body>
</html>

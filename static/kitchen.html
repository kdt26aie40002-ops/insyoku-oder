<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キッチン | テーブルオーダー</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/kitchen.css">
<script type="module" src="/kitchen.js"></script>
</head>
<body class="kitchen">
<header class="topbar">
  <div class="brand"><span aria-hidden="true">👨‍🍳</span>キッチン</div>
  <div class="kitchen-summary">
    <span>受付 <strong id="count-pending">0</strong></span>
    <span>調理中 <strong id="count-cooking">0</strong></span>
    <span id="clock"></span>
  </div>
</header>
<main class="kitchen-main">
  <div id="tickets" class="tickets"></div>
  <p id="empty" class="empty" hidden>現在、調理待ちの注文はありません</p>
</main>
<div id="toast-area" class="toast-area" aria-live="polite"></div>
</body>
</html>
